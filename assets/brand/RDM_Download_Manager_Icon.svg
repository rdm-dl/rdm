<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="RDM Download Manager icon">
 <defs>
  <linearGradient id="plate" x1="0.12" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#153f82"/><stop offset=".25" stop-color="#092658"/><stop offset=".62" stop-color="#071936"/><stop offset="1" stop-color="#04102a"/></linearGradient>
  <radialGradient id="plateLight" cx="25%" cy="6%" r="94%"><stop stop-color="#77bcff" stop-opacity=".35"/><stop offset=".35" stop-color="#1164c6" stop-opacity=".08"/><stop offset="1" stop-color="#020b25" stop-opacity="0"/></radialGradient>
  <linearGradient id="rim" x1=".1" y1="0" x2=".92" y2="1"><stop stop-color="#84edff"/><stop offset=".24" stop-color="#368dff"/><stop offset=".65" stop-color="#1045ff"/><stop offset="1" stop-color="#14b9ff"/></linearGradient>
  <linearGradient id="arrow" x1=".12" y1="0" x2=".82" y2="1"><stop stop-color="#82f5ff"/><stop offset=".32" stop-color="#46b6fc"/><stop offset=".72" stop-color="#2376f8"/><stop offset="1" stop-color="#4ae5ff"/></linearGradient>
  <linearGradient id="tray" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#93caff"/><stop offset=".22" stop-color="#5384cf"/><stop offset=".57" stop-color="#18449e"/><stop offset="1" stop-color="#0838b2"/></linearGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#57eaff"/><stop offset=".6" stop-color="#147aff"/><stop offset="1" stop-color="#09458f" stop-opacity="0"/></linearGradient>
  <radialGradient id="coreGlow"><stop stop-color="#00eaff" stop-opacity=".8"/><stop offset=".28" stop-color="#1269ff" stop-opacity=".6"/><stop offset="1" stop-color="#1859ff" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="smallGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="round"><rect x="47" y="47" width="930" height="930" rx="212"/></clipPath>
 </defs>
