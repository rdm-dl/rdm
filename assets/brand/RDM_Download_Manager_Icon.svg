  <!-- tray -->
  <path d="M209 574Q209 550 237 550H273Q300 550 300 578V683Q300 711 329 711H695Q724 711 724 683V578Q724 550 751 550H786Q814 550 814 578V744Q814 817 740 817H284Q209 817 209 742Z" fill="url(#tray)" stroke="#7cceff" stroke-width="5"/>
