<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <picture>
        <source srcset="logo-light.svg" media="(prefers-color-scheme: light)" />
        <img src="logo.svg" alt="RDM Download Manager" />
      </picture>
      <span id="status" class="status">Checking…</span>
    </div>
    <label class="switch" title="Capture downloads">
      <input type="checkbox" id="enabled" />
      <span></span>
    </label>
  </header>

  <section>
    <h2>Media on this page</h2>
    <ul id="media"></ul>
    <p id="empty" class="empty">No video or audio detected yet. Start playing the media, then reopen this panel.</p>
  </section>

  <section class="prefs">
    <label class="row">
      <span>Show download button on videos</span>
      <span class="switch small"><input type="checkbox" id="showButton" /><span></span></span>
    </label>
    <div id="blockedWrap" hidden>
      <h2>Button hidden on</h2>
      <div id="blocked" class="chips"></div>
    </div>
  </section>

  <section class="add">
    <input id="url" type="url" placeholder="Paste a link to download…" />
    <button id="add">Add</button>
  </section>

  <footer>
    <button id="open" class="ghost">Open RDM</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
