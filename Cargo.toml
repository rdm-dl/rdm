[workspace]
resolver = "2"
members = ["crates/rdm-core", "crates/rdm-cli", "crates/rdm-gui", "crates/rdm-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "gzip", "brotli", "deflate", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2"
futures-util = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
