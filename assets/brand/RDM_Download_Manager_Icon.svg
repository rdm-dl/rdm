 <rect x="53" y="53" width="918" height="918" rx="205" fill="#166eff" opacity=".55" filter="url(#glow)"/>
 <rect x="47" y="47" width="930" height="930" rx="212" fill="url(#plate)" stroke="url(#rim)" stroke-width="8"/>
